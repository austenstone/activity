# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # @actions/core and @actions/github v3+ are ESM-only and break ncc CJS bundles.
    # Pin to majors only when v4+ or a CJS-friendly release ships.
    # Same pattern as austenstone/schedule. See austenstone-notes LESSONS_LEARNED.md.
    # eslint v9+ plugin majors (eslint-plugin-jest 29, eslint-plugin-github 6, @eslint/js 10,
    # @typescript-eslint/* 8+) require eslint v9 peer dep; this repo is on eslint v8.
    # Ignore plugin majors until an eslint v8→v9 coordinated upgrade.
    # typescript v6+ deprecates moduleResolution=node10 and requires tsconfig migration
    # to node16/bundler or ignoreDeprecations: "6.0". Ignore majors until a planned
    # tsconfig modernization.
    # @types/node majors should track the runner's Node LTS (currently 22). Ignore
    # majors that outrun the runtime.
    # @vercel/ncc majors have historically changed bundle output / required Node bumps;
    # gate behind a planned bundler refresh.
    ignore:
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@actions/github"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-github"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vercel/ncc"
        update-types: ["version-update:semver-major"]
